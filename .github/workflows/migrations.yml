name: CD - Migracoes Supabase

on:
    push:
        branches:
            - main
        paths:
            - "supabase/migrations/**"
    workflow_dispatch:

jobs:
    deploy-migrations:
        name: Aplicar Migracoes no Banco de Dados
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do Repositorio
              uses: actions/checkout@v4

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Vincular Projeto e Aplicar Migracoes
              run: |
                  if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                    echo "Aviso: SUPABASE_ACCESS_TOKEN nao configurado neste repositorio."
                    echo "Pulando a execucao automatica de migracoes no Supabase com sucesso."
                    exit 0
                  fi

                  PROJECT="${PROJECT_ID:-jxblaxfwbiijkdwnneqw}"
                  echo "Conectando ao projeto Supabase: $PROJECT"
                  supabase link --project-ref "$PROJECT"
                  supabase db push
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
                  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
