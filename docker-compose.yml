# ==============================================================================
# PromoCuts - Orquestracao Docker Compose (Self-Hosted / VPS)
# Todos os servicos operam isolados atras do Nginx Gateway (apenas porta 80 exposta)
# ==============================================================================

services:
    # Gateway e Reverse Proxy de Borda: Nginx (Porta 80 Exposta)
    # A terminacao SSL / Porta 443 e gerenciada pela infraestrutura de nuvem
    nginx:
        image: nginx:alpine
        container_name: promocuts-nginx
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - promocuts-network

    # Aplicacao PromoCuts (Next.js Standalone - Apenas Rede Interna)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: promocuts-app
        restart: unless-stopped
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-promocuts}
            - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
            - ADMIN_EMAIL=${ADMIN_EMAIL}
            # Seguranca e Isolamento por VPN no /admin
            - ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS:-}
            # Single Sign-On (SSO) para o Painel /admin
            - SSO_PROVIDER=${SSO_PROVIDER:-}
            - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
            - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
            - SSO_ISSUER_URL=${SSO_ISSUER_URL:-}
            - AUTH_SECRET=${AUTH_SECRET:-}
            # Cache e Rate Limiting via Redis (Opcional)
            - REDIS_URL=${REDIS_URL:-redis://redis:6379}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - promocuts-network

    # Banco de Dados Relacional: PostgreSQL 18.6 (Apenas Rede Interna)
    db:
        image: postgres:18.6-alpine
        container_name: promocuts-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-promocuts}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-promocuts}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - promocuts-network

    # Cache em Memoria e Rate Limiting: Redis 8 (Apenas Rede Interna)
    redis:
        image: redis:8-alpine
        container_name: promocuts-redis
        restart: unless-stopped
        command: redis-server --save 60 1 --loglevel warning
        volumes:
            - redis_data:/data
        networks:
            - promocuts-network

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local

networks:
    promocuts-network:
        driver: bridge
