# ==============================================================================
# PromoCuts - Configuracao do Nginx (Reverse Proxy & Edge Gateway)
# Porta 80 exposta com terminacao SSL gerenciada pela infraestrutura de nuvem
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Desativa exibicao da versao do Nginx por seguranca
    server_tokens off;

    # Limite maximo de upload para imagens de produtos e logos
    client_max_body_size 25M;

    # Compressao Gzip para acelerar a entrega no cliente
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Encaminhamento para a aplicacao Next.js Standalone
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Cabecalhos de encaminhamento e preservacao de identidade
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Reconhece o upgrade de SSL/HTTPS realizado pela infraestrutura de nuvem
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a conexoes persistentes e WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de conexao
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Otimizacao de buffers de resposta
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Bloqueio de arquivos ocultos ou sensiveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
