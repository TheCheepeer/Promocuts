# ==============================================================================
# PromoCuts - Configuracao do Nginx (Reverse Proxy & Edge Gateway Endurecido)
# Porta 80 exposta com terminacao SSL gerenciada pela infraestrutura de nuvem
# ==============================================================================

# 1. Mapeamento de Upgrade de Conexoes WebSocket (Evita quebra de keep-alive HTTP)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. Mapeamento de Protocolo SSL (Evita spoofing de X-Forwarded-Proto)
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 3. Zonas de Rate Limiting para Mitigacao de DoS e Forca Bruta (OWASP A04 / A05)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # Desativa exibicao da versao do Nginx por seguranca (OWASP A05:2021)
    server_tokens off;

    # Limite maximo global restrito para evitar exaustao de memoria/DoS (OWASP A04:2021)
    client_max_body_size 2M;

    # Limite de conexoes simultaneas por IP
    limit_conn conn_limit 20;

    # 4. Cabecalhos Defensivos de Seguranca HTTP (OWASP A05:2021 / CWE-1021 / CWE-693)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; frame-src 'self' https://www.tiktok.com https://www.instagram.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https:;" always;

    # Compressao Gzip para acelerar a entrega no cliente
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Rotas Administrativas com Rate Limiting Rigoroso e Limite de Upload Adequado
    location /admin {
        limit_req zone=admin_limit burst=10 nodelay;
        client_max_body_size 25M;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Encaminhamento Geral para a aplicacao Next.js Standalone
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Cabecalhos de encaminhamento e preservacao de identidade
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a conexoes persistentes e WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts de conexao
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Otimizacao de buffers de resposta
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Bloqueio de arquivos ocultos ou sensiveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
